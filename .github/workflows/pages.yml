# Preview deployment to GitHub Pages.
#
# This is for LAYOUT REVIEW ONLY. The production target is Cloudflare Pages:
#   - GitHub's Terms exclude using Pages "to run your online business,
#     e-commerce site, or any other website that is primarily directed at
#     either facilitating commercial transactions", which this site is.
#   - Cloudflare Pages measures 0% blocked from mainland China, where the
#     artist is; github.io is not somewhere to point Chinese buyers.
#
# The published preview is public and carries noindex on every page.

name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # sharp ships prebuilt binaries for linux-x64; no system libvips needed.
      - run: npm ci || npm install

      # npm run check ends by running scripts/image.py's own selftest, which
      # is the only thing in the suite that is Python. Four wheels, no system
      # packages — vtracer among them, so the trace profiles are covered here
      # rather than reported as "not run". Without these the check cannot run,
      # and a check that cannot run is not allowed to pass quietly.
      - name: Python tools
        run: python3 -m pip install --quiet --disable-pip-version-check pillow numpy cairosvg vtracer

      # BASE_PATH: a project site serves from /<repo>/, so every absolute URL
      # needs that prefix. SITE_URL feeds canonical, og:url and the sitemap.
      # No RELEASE=1: this is a preview, which the build makes by default —
      # noindex on every page, a preview ribbon, and purchase controls that
      # cannot be used while the readiness gate is closed.
      # The same three variables go to the checks, so they test the build that
      # was actually made rather than an unprefixed one that was not.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      # What is still owed before the site may go live, on the run's summary
      # page. Report only: a preview is allowed to be unready; a release is not.
      - name: Readiness report
        run: node scripts/check-readiness.mjs --report

      - name: Check
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run check

      # Lays the pages out in the runner's Chrome and fails if any painting is
      # drawn out of proportion, rounded or transformed — the one promise of
      # the softness pass that only a browser can check.
      - name: Check rendering
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run check:render

      # Pages will not serve paths beginning with an underscore unless this
      # file is present. The site has none today, but the guard is free.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
